<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Storage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        .search-bar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .search-bar input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            border-color: #667eea;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: white;
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .folder-section {
            margin-bottom: 40px;
        }

        .folder-title {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 15px;
            padding: 0 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .file-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .folder-card {
            cursor: pointer;
            background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%);
            border: 3px solid #e17055;
        }

        .folder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(243, 156, 18, 0.4);
        }

        .folder-card .file-icon {
            font-size: 3rem;
        }

        .file-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 2rem;
        }

        .file-icon.image { background: #ffeaa7; }
        .file-icon.document { background: #74b9ff; }
        .file-icon.video { background: #ff7675; }
        .file-icon.audio { background: #a29bfe; }
        .file-icon.archive { background: #fdcb6e; }
        .file-icon.code { background: #55efc4; }
        .file-icon.other { background: #dfe6e9; }

        .file-info {
            text-align: center;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .file-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .file-meta {
            font-size: 0.85rem;
            color: #636e72;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .file-meta span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .no-files {
            text-align: center;
            color: white;
            padding: 60px 20px;
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .files-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                gap: 15px;
            }

            .stat-item {
                padding: 10px 20px;
                flex: 1 1 40%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📁 File Storage</h1>
            <p>Browse and download files</p>
        </header>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalFiles">0</div>
                <div class="stat-label">Total Files</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalSize">0 MB</div>
                <div class="stat-label">Total Size</div>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search files..." autocomplete="off">
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <button id="refreshBtn" class="download-btn" style="background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);">
                🔄 Refresh Files
            </button>
        </div>

        <div id="filesContainer" class="files-grid"></div>

        <footer>
            <p>File Storage &copy; 2024 | Simple, Fast, Secure</p>
        </footer>
    </div>

    <script>
        let allFiles = [];
        const filesBasePath = 'files/';
        let currentFolder = '';

        // ============================================
        // FILE TYPE ICONS
        // ============================================
        const icons = {
            image: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e17055" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
            document: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0984e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`,
            video: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d63031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`,
            audio: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`,
            archive: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>`,
            code: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00b894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>`,
            other: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#636e72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>`
        };

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function formatFileSize(bytes) {
            if (!bytes || isNaN(bytes)) return 'Unknown size';
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getFileExtension(filename) {
            const lower = filename.toLowerCase();
            // Handle multi-part zip files: name.zip.001, name.zip.0001 -> zip
            if (lower.endsWith('.zip.001') || lower.match(/\.zip\.\d{3,}$/)) {
                return 'zip';
            }
            // Handle other multi-part archives: name.rar.001, name.7z.0001, etc.
            const multiPartMatch = lower.match(/\.(rar|7z|tar|gz)\.\d{3,}$/);
            if (multiPartMatch) {
                return multiPartMatch[1];
            }
            // Regular file
            const parts = filename.split('.');
            return parts.length > 1 ? parts.pop().toLowerCase() : '';
        }

        function getFileType(filename) {
            const ext = getFileExtension(filename);
            const types = {
                image: ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp', 'ico'],
                document: ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'rtf', 'odt'],
                video: ['mp4', 'avi', 'mov', 'wmv', 'flv', 'mkv', 'webm'],
                audio: ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma'],
                archive: ['zip', 'rar', '7z', 'tar', 'gz', 'bz2'],
                code: ['js', 'html', 'css', 'py', 'java', 'cpp', 'c', 'php', 'json', 'xml']
            };

            for (const [type, extensions] of Object.entries(types)) {
                if (extensions.includes(ext)) return type;
            }
            return 'other';
        }

        // ============================================
        // RENDER FILES
        // ============================================
        function renderFiles(filesToRender) {
            const container = document.getElementById('filesContainer');
            
            // Filter files for current folder
            const prefix = currentFolder ? currentFolder + '/' : '';
            const inFolder = filesToRender.filter(f => f.name.startsWith(prefix) && f.name !== prefix.slice(0, -1));
            
            // Get unique subfolders at current level
            const subfolders = new Set();
            const filesInFolder = [];
            
            inFolder.forEach(file => {
                const relative = file.name.slice(prefix.length);
                const parts = relative.split('/');
                
                if (parts.length > 1) {
                    // This file is in a subfolder
                    subfolders.add(parts[0]);
                } else {
                    // This file is directly in current folder
                    filesInFolder.push(file);
                }
            });
            
            let html = '';
            
            // Back button (if not at root)
            if (currentFolder) {
                html += `<div class="folder-section" style="margin-bottom: 20px;">
                    <button onclick="navigateTo('')" class="download-btn" style="background: linear-gradient(135deg, #636e72 0%, #2d3436 100%);">
                        ⬅ Back
                    </button>
                </div>`;
            }
            
            // Render subfolders
            const sortedFolders = Array.from(subfolders).sort();
            if (sortedFolders.length > 0) {
                html += '<div class="files-grid">';
                sortedFolders.forEach(folderName => {
                    html += `
                        <div class="file-card folder-card" onclick="navigateTo('${prefix + folderName}')">
                            <div class="file-icon folder">
                                📁
                            </div>
                            <div class="file-info">
                                <div class="file-name">${folderName}</div>
                                <div class="file-meta">
                                    <span>📂 Folder</span>
                                </div>
                            </div>
                            <div class="download-btn" style="background: linear-gradient(135deg, #00b894 0%, #00cec9 100%); cursor: pointer;">
                                Open
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            // Render files in current folder
            if (filesInFolder.length > 0) {
                if (sortedFolders.length > 0) {
                    html += '<div class="folder-section"><h2 class="folder-title">📄 Files</h2><div class="files-grid">';
                } else {
                    html += '<div class="files-grid">';
                }
                html += filesInFolder.map(file => renderFileCard(file)).join('');
                html += '</div>';
            }
            
            if (inFolder.length === 0) {
                container.innerHTML = '<div class="no-files">This folder is empty.</div>';
                return;
            }
            
            container.innerHTML = html;
        }

        function navigateTo(folderPath) {
            currentFolder = folderPath;
            renderFiles(allFiles);
        }

        function renderFileCard(file) {
            const type = getFileType(file.name);
            const icon = icons[type] || icons.other;
            const size = formatFileSize(file.size);
            const displayName = file.name.split('/').pop();
            
            return `
                <div class="file-card">
                    <div class="file-icon ${type}">
                        ${icon}
                    </div>
                    <div class="file-info">
                        <div class="file-name" title="${file.name}">${displayName}</div>
                        <div class="file-meta">
                            <span>📊 ${size}</span>
                            <span>📄 ${displayName.split('.').pop().toUpperCase()}</span>
                        </div>
                    </div>
                    <a href="${file.downloadPath}" class="download-btn" download>
                        ⬇ Download
                    </a>
                </div>
            `;
        }

        // ============================================
        // UPDATE STATS
        // ============================================
        function updateStats() {
            const totalFiles = allFiles.length;
            const totalSize = allFiles.reduce((sum, file) => sum + (file.size || 0), 0);
            
            document.getElementById('totalFiles').textContent = totalFiles;
            document.getElementById('totalSize').textContent = formatFileSize(totalSize);
        }

        // ============================================
        // SEARCH FUNCTIONALITY
        // ============================================
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            if (searchTerm) {
                // Search across all files
                const filteredFiles = allFiles.filter(file => 
                    file.name.toLowerCase().includes(searchTerm)
                );
                renderFiles(filteredFiles);
            } else {
                // Show current folder when search is cleared
                renderFiles(allFiles);
            }
        });

        // ============================================
        // LOAD FILES MANIFEST
        // ============================================
        async function loadFiles() {
            // Check localStorage cache first (refresh every 5 minutes)
            const cached = localStorage.getItem('fileStorageCache');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (parsed.files && parsed.timestamp && (Date.now() - parsed.timestamp < 300000)) {
                        allFiles = parsed.files;
                        renderFiles(allFiles);
                        updateStats();
                        
                        // Still refresh in background
                        refreshFiles();
                        return;
                    }
                } catch (e) {
                    // Ignore corrupt cache
                }
            }
            
            await refreshFiles();
        }
        
        async function refreshFiles() {
            try {
                // Try loading manifest first
                const response = await fetch(filesBasePath + 'files.json', {cache: 'no-store'});
                if (!response.ok) throw new Error('No manifest found');
                
                const manifest = await response.json();
                if (!Array.isArray(manifest) || manifest.length === 0) {
                    throw new Error('Empty manifest');
                }
                
                allFiles = manifest.map(entry => ({
                    name: entry.name,
                    size: entry.size || 0,
                    type: entry.type || 'other',
                    // Store clean display path for UI, actual download path in data attribute
                    displayPath: '/' + entry.name,
                    downloadPath: filesBasePath + encodeURIComponent(entry.name)
                }));
                
                renderFiles(allFiles);
                updateStats();
                currentFolder = '';
                localStorage.setItem('fileStorageCache', JSON.stringify({files: allFiles, timestamp: Date.now()}));
            } catch (err) {
                // Fallback: try directory listing
                try {
                    const dirResponse = await fetch(filesBasePath, {cache: 'no-store'});
                    if (!dirResponse.ok) throw new Error('Directory not accessible');
                    
                    const html = await dirResponse.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const links = Array.from(doc.querySelectorAll('a'));
                    
                    const seen = new Set();
                    allFiles = [];
                    
                    for (const a of links) {
                        let href = a.getAttribute('href');
                        if (!href) continue;
                        
                        // Skip parent directory links
                        if (href === '../' || href === './' || href === '/') continue;
                        
                        // Strip query strings and anchors
                        href = href.split('?')[0].split('#')[0];
                        if (!href || href.endsWith('/')) continue;
                        
                        // Extract filename from path
                        const name = decodeURIComponent(href.replace(/^.*\//, ''));
                        if (!name || seen.has(name)) continue;
                        seen.add(name);
                        
                        // Try to get size from parent directory listing text
                        const parent = a.parentElement;
                        let size = 0;
                        if (parent) {
                            const text = parent.textContent || '';
                            const match = text.match(/(\d+(?:\.\d+)?)\s*(B|KB|MB|GB|TB)/i);
                            if (match) {
                                const value = parseFloat(match[1]);
                                const unit = match[2].toUpperCase();
                                const units = {'B': 1, 'KB': 1024, 'MB': 1024*1024, 'GB': 1024*1024*1024, 'TB': 1024*1024*1024*1024};
                                size = value * (units[unit] || 1);
                            }
                        }
                        
                        allFiles.push({
                            name: name,
                            size: size,
                            type: getFileType(name),
                            displayPath: '/' + name,
                            downloadPath: filesBasePath + encodeURIComponent(name)
                        });
                    }
                    
                    if (allFiles.length > 0) {
                        renderFiles(allFiles);
                        updateStats();
                        currentFolder = '';
                        localStorage.setItem('fileStorageCache', JSON.stringify({files: allFiles, timestamp: Date.now()}));
                    } else {
                        document.getElementById('filesContainer').innerHTML = 
                            '<div class="no-files">No files found. Add files to the <code>files/</code> directory or upload a <code>files/files.json</code> manifest.</div>';
                    }
                } catch (dirErr) {
                    document.getElementById('filesContainer').innerHTML = 
                        '<div class="no-files">Unable to load files. Upload files to the <code>files/</code> directory and ensure directory listing is enabled, or add a <code>files/files.json</code> manifest.</div>';
                }
            }
        }

        // ============================================
        // INITIALIZE
        // ============================================
        loadFiles();
        
        // Refresh button
        document.getElementById('refreshBtn').addEventListener('click', async () => {
            localStorage.removeItem('fileStorageCache');
            const btn = document.getElementById('refreshBtn');
            btn.textContent = '⏳ Refreshing...';
            btn.disabled = true;
            currentFolder = '';
            await refreshFiles();
            btn.textContent = '🔄 Refresh Files';
            btn.disabled = false;
        });
    </script>
</body>
</html>
